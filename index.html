<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>twilit — 虚室生白</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Space+Mono&display=swap');

  :root {
    --bg: #080b10;
    --twilight: #c9a96e;
    --twilight-dim: #7a6543;
    --twilight-pale: #e8d5b0;
    --scanline: rgba(201,169,110,0.03);
    --card-bg: #0d1119;
    --card-border: rgba(201,169,110,0.12);
    --text: #b8b4a8;
    --text-dim: #6b6760;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    animation: pageReveal 0.5s ease-out;
  }
  @keyframes pageReveal {
    from { opacity: 0; filter: brightness(1.6) blur(1px); }
    to   { opacity: 1; filter: brightness(1) blur(0); }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    line-height: 1.8;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT overlay */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 100;
    animation: scanlineJitter 8s infinite;
  }
  @keyframes scanlineJitter {
    0%, 100% { opacity: 1; transform: translateY(0); }
    1%  { opacity: 0.82; }
    2%  { opacity: 1; }
    50% { opacity: 0.94; }
    52% { opacity: 1; }
    97% { opacity: 0.88; }
    98% { opacity: 1; }
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(8,11,16,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  /* ================================================
     Layout
     ================================================ */
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    position: relative;
    z-index: 1;
  }

  @media (min-width: 768px) {
    .container {
      max-width: 900px;
      padding: 4rem 2.5rem 5rem;
    }
  }

  /* ================================================
     Hero / Title
     ================================================ */
  .hero {
    text-align: center;
    margin-bottom: 1.2rem;
    padding-top: 1.5rem;
  }
  .domain {
    font-family: 'Space Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    color: var(--twilight-dim);
    text-transform: lowercase;
    margin-bottom: 0.6rem;
  }
  .motto {
    font-size: 1.6rem;
    font-weight: 300;
    color: var(--twilight);
    letter-spacing: 0.25em;
    margin-bottom: 0.4rem;
  }

  @media (min-width: 768px) {
    .hero { padding-top: 2.5rem; margin-bottom: 1.8rem; }
    .domain { font-size: 0.9rem; }
    .motto { font-size: 2.2rem; letter-spacing: 0.3em; }
  }

  /* ================================================
     Digital Clock
     ================================================ */
  .clock-section {
    text-align: center;
    margin-bottom: 2rem;
  }
  .clock-time {
    font-family: 'Space Mono', monospace;
    font-size: 2.4rem;
    color: var(--twilight-pale);
    letter-spacing: 0.12em;
    line-height: 1;
    text-shadow: 0 0 18px rgba(201,169,110,0.15);
  }
  .clock-seconds {
    font-size: 1.2rem;
    color: var(--twilight-dim);
    vertical-align: super;
    letter-spacing: 0.05em;
  }
  .clock-quiet {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-top: 0.5rem;
    opacity: 0.7;
  }

  @media (min-width: 768px) {
    .clock-time { font-size: 3.6rem; }
    .clock-seconds { font-size: 1.6rem; }
    .clock-quiet { font-size: 0.78rem; }
  }

  /* ================================================
     Typewriter Monologue
     ================================================ */
  .typewriter-section {
    margin-bottom: 2rem;
  }
  .typewriter-box {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 1.2rem 1.4rem;
    min-height: 5rem;
    position: relative;
  }
  .typewriter-text {
    font-size: 0.92rem;
    color: var(--text);
    line-height: 2;
    letter-spacing: 0.03em;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .typewriter-cursor {
    display: inline-block;
    width: 1px;
    height: 1em;
    background: var(--twilight);
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: cursorBlink 0.8s step-end infinite;
  }
  .typewriter-cursor.paused {
    animation: cursorBlinkSlow 1.6s step-end infinite;
  }
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes cursorBlinkSlow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .typewriter-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  @media (min-width: 768px) {
    .typewriter-box { padding: 1.5rem 1.8rem; min-height: 6rem; }
    .typewriter-text { font-size: 1rem; line-height: 2.2; }
  }

  /* ================================================
     Poetry Card
     ================================================ */
  .poetry-section {
    margin-bottom: 2rem;
  }
  .poetry-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 1.2rem 1.4rem;
    text-align: center;
    transition: border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease;
    cursor: pointer;
    user-select: none;
  }
  .poetry-card:hover {
    border-color: var(--twilight-dim);
    box-shadow: 0 4px 20px rgba(201,169,110,0.08);
  }
  .poetry-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.88rem;
    color: var(--twilight-pale);
    letter-spacing: 0.08em;
    margin-bottom: 0.6rem;
  }
  .poetry-body {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 2.2;
    letter-spacing: 0.04em;
    white-space: pre-line;
  }
  .poetry-author {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-top: 0.8rem;
  }
  .poetry-hint {
    font-family: 'Space Mono', monospace;
    font-size: 0.58rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    margin-top: 0.7rem;
    opacity: 0.5;
  }
  .poetry-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
  }

  @media (min-width: 768px) {
    .poetry-card { padding: 1.5rem 2rem; }
    .poetry-title { font-size: 0.95rem; }
    .poetry-body { font-size: 0.9rem; line-height: 2.4; }
  }

  /* ================================================
     Footer / Nav
     ================================================ */
  .footer {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2.5rem;
    letter-spacing: 0.1em;
    animation: footerBreathe 4.5s ease-in-out infinite;
  }
  @keyframes footerBreathe {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
  .footer a {
    color: var(--twilight-dim);
    text-decoration: none;
    transition: color 0.3s;
  }
  .footer a:hover { color: var(--twilight); }

  /* ================================================
     Shared Effects (from original)
     ================================================ */

  /* Mouse Glow */
  #mouse-glow {
    position: fixed;
    pointer-events: none;
    z-index: 98;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.07) 0%, rgba(201,169,110,0.02) 40%, transparent 70%);
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.5s ease;
    will-change: left, top, opacity;
  }

  /* CRT Noise Overlay */
  #crt-noise {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 97;
    opacity: 0.03;
    animation: crtNoiseFlicker 6s infinite;
  }
  @keyframes crtNoiseFlicker {
    0%, 100% { opacity: 0.02; }
    3%  { opacity: 0.05; }
    6%  { opacity: 0.02; }
    50% { opacity: 0.035; }
    53% { opacity: 0.02; }
  }

  /* Click Ripple */
  .click-ripple {
    position: fixed;
    pointer-events: none;
    z-index: 151;
    border: 1px solid rgba(201,169,110,0.35);
    border-radius: 50%;
    animation: rippleExpand 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes rippleExpand {
    from { width: 0; height: 0; opacity: 0.6; }
    to   { width: 130px; height: 130px; opacity: 0; margin-left: -65px; margin-top: -65px; }
  }

  /* Title Hover Pulse */
  .motto:hover, .clock-time:hover {
    animation: titlePulse 0.9s ease-in-out;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 6px #c9a96e; }
    50%      { text-shadow: 0 0 22px #c9a96e, 0 0 45px #c9a96e; }
  }

  a, button {
    transition: color 0.25s ease, background 0.25s ease,
                border-color 0.25s ease, box-shadow 0.25s ease,
                transform 0.2s ease, opacity 0.25s ease;
  }

  /* Three.js Canvas */
  #three-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* Audio Toggle Button */
  #audio-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 300;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(201,169,110,0.18);
    background: rgba(0,0,0,0.55);
    color: rgba(201,169,110,0.45);
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #audio-toggle:hover {
    border-color: rgba(201,169,110,0.5);
    color: rgba(201,169,110,0.8);
    box-shadow: 0 0 16px rgba(201,169,110,0.2);
  }
  #audio-toggle.playing {
    opacity: 0.22;
    border-color: rgba(201,169,110,0.3);
  }
  #audio-toggle.playing:hover { opacity: 0.65; }

  /* Audio Hint Bar */
  #audio-hint {
    position: fixed;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 400;
    background: rgba(8,11,14,0.94);
    border: 1px solid rgba(201,169,110,0.22);
    border-top: none;
    padding: 0.45rem 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: rgba(201,169,110,0.72);
    letter-spacing: 0.07em;
    text-shadow: 0 0 8px rgba(201,169,110,0.18);
    opacity: 1;
    transition: opacity 0.55s ease, transform 0.55s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    border-radius: 0 0 1px 1px;
    white-space: nowrap;
  }
  .audio-hint-dot {
    display: inline-block;
    width: 4px; height: 4px;
    background: rgba(201,169,110,0.5);
    border-radius: 50%;
    flex-shrink: 0;
    animation: hintDotBlink 1.3s ease-in-out infinite;
  }
  @keyframes hintDotBlink {
    0%, 100% { opacity: 0.25; box-shadow: 0 0 2px rgba(201,169,110,0.3); }
    50%      { opacity: 1;    box-shadow: 0 0 8px rgba(201,169,110,0.5); }
  }
</style>

<!-- ================================================
     JS: Dynamic Effects (Mouse Glow, Ripple, Noise)
     ================================================ -->
<script>
(function() {
  /* Mouse Glow */
  var glow = document.createElement('div');
  glow.id = 'mouse-glow';
  document.body.appendChild(glow);
  var glowTimer = null;
  document.addEventListener('mousemove', function(e) {
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
    glow.style.opacity = '1';
    clearTimeout(glowTimer);
    glowTimer = setTimeout(function() { glow.style.opacity = '0'; }, 1800);
  });
  document.addEventListener('mouseleave', function() { glow.style.opacity = '0'; });

  /* CRT Noise Overlay */
  var noise = document.createElement('div');
  noise.id = 'crt-noise';
  (function() {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">' +
      '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>' +
      '</filter><rect width="100%" height="100%" filter="url(#n)" opacity="0.5"/></svg>';
    noise.style.backgroundImage = 'url(data:image/svg+xml,' + encodeURIComponent(svg) + ')';
    noise.style.backgroundSize = '120px 120px';
  })();
  document.body.appendChild(noise);

  /* Click Ripple */
  document.addEventListener('click', function(e) {
    var ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 750);
  });
})();
</script>

<!-- ================================================
     JS: Floating Particles Canvas
     ================================================ -->
<script>
(function() {
  var pc = document.createElement('canvas');
  pc.id = 'particle-canvas';
  pc.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
  document.body.insertBefore(pc, document.body.firstChild);
  var pctx = pc.getContext('2d');
  var parts = [];
  function resizep() { pc.width = window.innerWidth; pc.height = window.innerHeight; }
  resizep();
  window.addEventListener('resize', function() { resizep(); rebuildParts(); });
  function rebuildParts() {
    parts = [];
    var cnt = Math.min(Math.floor(pc.width * pc.height / 14000), 120);
    for (var i = 0; i < cnt; i++) {
      parts.push({
        x: Math.random() * pc.width, y: Math.random() * pc.height,
        vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
        sz: Math.random() * 1.4 + 0.3, a: Math.random() * 0.35 + 0.04,
        fd: Math.random() > 0.5 ? 1 : -1
      });
    }
  }
  rebuildParts();
  function particleLoop() {
    pctx.clearRect(0, 0, pc.width, pc.height);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.a += p.fd * 0.0025;
      if (p.a > 0.4) p.fd = -1;
      if (p.a < 0.03) p.fd = 1;
      if (p.x < -10) p.x = pc.width + 10;
      if (p.x > pc.width + 10) p.x = -10;
      if (p.y < -10) p.y = pc.height + 10;
      if (p.y > pc.height + 10) p.y = -10;
      pctx.beginPath();
      pctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
      pctx.fillStyle = 'rgba(201,169,110,' + p.a + ')';
      pctx.fill();
    }
    requestAnimationFrame(particleLoop);
  }
  particleLoop();
})();
</script>

<!-- ================================================
     JS: Audio (Lo-Fi Ambient)
     ================================================ -->
<script>
(function() {
  var audioCtx = null;
  var masterGain = null;
  var droneOsc = null;
  var droneGain = null;
  var isPlaying = false;
  var noteTimer = null;
  var pentatonic = [130.81, 146.83, 164.81, 196, 220, 261.63, 293.66, 329.63, 392, 440];

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    } catch(e) { return; }
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.06;
    masterGain.connect(audioCtx.destination);

    droneOsc = audioCtx.createOscillator();
    droneOsc.type = 'sine';
    droneOsc.frequency.value = 55;
    droneGain = audioCtx.createGain();
    droneGain.gain.value = 0.12;
    droneOsc.connect(droneGain);
    droneGain.connect(masterGain);
    droneOsc.start();

    var harmOsc = audioCtx.createOscillator();
    harmOsc.type = 'sine';
    harmOsc.frequency.value = 82.5;
    var harmGain = audioCtx.createGain();
    harmGain.gain.value = 0.05;
    harmOsc.connect(harmGain);
    harmGain.connect(masterGain);
    harmOsc.start();

    isPlaying = true;
    scheduleNote();
  }

  function scheduleNote() {
    if (!isPlaying) return;
    var delay = 3000 + Math.random() * 6000;
    noteTimer = setTimeout(function() {
      if (!isPlaying || !audioCtx) return;
      try {
        var freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
        var osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq * 0.5;
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 0.4);
        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2.8);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 2.9);
      } catch(e) {}
      scheduleNote();
    }, delay);
  }

  function stopAudio() {
    isPlaying = false;
    clearTimeout(noteTimer);
    try {
      if (droneOsc) { droneOsc.stop(); droneOsc.disconnect(); droneOsc = null; }
    } catch(e) {}
    try {
      if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
    } catch(e) {}
    audioCtx = null;
  }

  var btn = document.createElement('button');
  btn.id = 'audio-toggle';
  btn.innerHTML = '&#9835;';
  btn.title = 'Ambient sound';
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    e.preventDefault();
    if (!audioCtx || audioCtx.state === 'closed') {
      initAudio();
      btn.classList.add('playing');
    } else if (isPlaying) {
      stopAudio();
      btn.classList.remove('playing');
      btn.style.opacity = '0';
    }
  });
  btn.addEventListener('mouseenter', function() { btn.style.opacity = '1'; });
  btn.addEventListener('mouseleave', function() {
    if (!isPlaying) btn.style.opacity = '0';
    else btn.style.opacity = '0.22';
  });
  document.body.appendChild(btn);

  var autoStarted = false;
  document.addEventListener('click', function autoStart() {
    if (autoStarted) return;
    autoStarted = true;
    initAudio();
    btn.classList.add('playing');
  }, {once: true});
  document.addEventListener('touchstart', function autoStart() {
    if (autoStarted) return;
    autoStarted = true;
    initAudio();
    btn.classList.add('playing');
  }, {once: true});

  // Audio hint dismiss
  (function(){
    var hint = document.getElementById('audio-hint');
    if (!hint) return;
    var gone = false;
    function dismiss() {
      if (gone) return; gone = true;
      hint.style.opacity = '0';
      hint.style.transform = 'translateX(-50%) translateY(-120%)';
      setTimeout(function(){ hint.remove(); }, 600);
    }
    setTimeout(dismiss, 3500);
    document.addEventListener('click', dismiss, {once: true});
    document.addEventListener('touchstart', dismiss, {once: true});
  })();
})();
</script>

<!-- ================================================
     JS: Three.js 3D Particle Sphere
     ================================================ -->
<script>
(function() {
  if (typeof THREE === 'undefined') return;

  var container = document.createElement('div');
  container.id = 'three-canvas';
  document.body.insertBefore(container, document.body.firstChild);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 5;

  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  var group = new THREE.Group();
  scene.add(group);

  var colorHex = 0xc9a96e;

  // Icosahedron wireframe
  var icoGeo = new THREE.IcosahedronGeometry(1.8, 2);
  var edgesGeo = new THREE.EdgesGeometry(icoGeo);
  var wireframe = new THREE.LineSegments(
    edgesGeo,
    new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.09 })
  );
  group.add(wireframe);

  // Surface dots
  var dotsGeo = new THREE.IcosahedronGeometry(1.8, 3);
  var dotsPositions = dotsGeo.attributes.position.array;
  var sampled = [];
  for (var i = 0; i < dotsPositions.length; i += 6) {
    sampled.push(dotsPositions[i], dotsPositions[i+1], dotsPositions[i+2]);
  }
  var ptsGeo = new THREE.BufferGeometry();
  ptsGeo.setAttribute('position', new THREE.Float32BufferAttribute(sampled, 3));
  var ptsMat = new THREE.PointsMaterial({ color: colorHex, size: 0.025, transparent: true, opacity: 0.22 });
  var surfacePts = new THREE.Points(ptsGeo, ptsMat);
  group.add(surfacePts);

  // Floating ambient particles
  var floatCount = 80;
  var floatPositions = new Float32Array(floatCount * 3);
  var floatData = [];
  for (var j = 0; j < floatCount; j++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 1.8 + Math.random() * 1.2;
    floatPositions[j*3] = r * Math.sin(phi) * Math.cos(theta);
    floatPositions[j*3+1] = r * Math.sin(phi) * Math.sin(theta);
    floatPositions[j*3+2] = r * Math.cos(phi);
    floatData.push({
      baseX: floatPositions[j*3],
      baseY: floatPositions[j*3+1],
      baseZ: floatPositions[j*3+2],
      speed: 0.0005 + Math.random() * 0.002,
      phase: Math.random() * Math.PI * 2,
      amp: 0.1 + Math.random() * 0.3
    });
  }
  var floatGeo = new THREE.BufferGeometry();
  floatGeo.setAttribute('position', new THREE.Float32BufferAttribute(floatPositions, 3));
  var floatPts = new THREE.Points(
    floatGeo,
    new THREE.PointsMaterial({ color: colorHex, size: 0.018, transparent: true, opacity: 0.13 })
  );
  group.add(floatPts);

  // Subtle ring
  var ringGeo = new THREE.TorusGeometry(2.1, 0.015, 16, 80);
  var ring = new THREE.Mesh(
    ringGeo,
    new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.06 })
  );
  ring.rotation.x = Math.PI / 3;
  group.add(ring);

  var time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.003;
    group.rotation.x += 0.0008;
    group.rotation.y += 0.0012;

    var posArray = floatPts.geometry.attributes.position.array;
    for (var k = 0; k < floatData.length; k++) {
      var fd = floatData[k];
      posArray[k*3] = fd.baseX + Math.sin(time * 3 + fd.phase) * fd.amp;
      posArray[k*3+1] = fd.baseY + Math.cos(time * 2.5 + fd.phase) * fd.amp;
      posArray[k*3+2] = fd.baseZ + Math.sin(time * 2 + fd.phase + 1) * fd.amp;
    }
    floatPts.geometry.attributes.position.needsUpdate = true;

    ring.rotation.z += 0.001;

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>

<!-- ================================================
     JS: Digital Clock
     ================================================ -->
<script>
(function() {
  var hhmmEl = document.getElementById('clock-hhmm');
  var ssEl = document.getElementById('clock-ss');
  var quietEl = document.getElementById('clock-quiet');
  var startTime = Date.now();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function formatDuration(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var parts = [];
    if (h > 0) parts.push(h + ' 时');
    if (m > 0) parts.push(m + ' 分');
    parts.push(s + ' 秒');
    return parts.join(' ');
  }

  function tick() {
    var now = new Date();
    hhmmEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    ssEl.textContent = pad(now.getSeconds());
    var elapsed = Date.now() - startTime;
    quietEl.textContent = '你已在此停留 ' + formatDuration(elapsed);
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

<!-- ================================================
     JS: Typewriter Monologue Engine
     ================================================ -->
<script>
(function() {
  var monologues = [
    "凌晨三点。屏幕亮着。\n没有人说话，但一切都在呼吸。",
    "代码写完了，bug 还在。\n像极了某些说不出口的话。",
    "窗外没有声音。\n城市睡着了，但路由器还醒着。",
    "一杯水从热放到凉。\n日历翻过去，什么都没发生。\n这样的一天，也很好。",
    "旧电脑的风扇声像海。\n我把耳朵贴上去，\n听见 2005 年的冬天。",
    "有人问你在想什么。\n你说没什么。\n其实你在想：\n为什么琥珀色的光这么好看。",
    "很多话不需要说。\n说了就轻了。",
    "凌晨四点四十八分。\n这只猫在我腿上睡着了。\n我不动。\n世界可以等我。",
    "调试了一天。\n最后发现少了一个分号。\n像人生里的某些错过。",
    "关了灯。屏幕光打在手背上。\n青色和琥珀色。\n比白天更真实。",
    "今天没有做什么了不起的事。\n但也没有辜负自己。\n这样就够了。",
    "夜深了。\n楼下便利店还亮着灯。\n这个世界上总有人在等你。",
    "有些话只适合打在屏幕上。\n然后删掉。\n然后打一遍。\n然后再删掉。",
    "你盯着光标。光标也盯着你。\n你们都知道这一刻不会重来。",
    "夏天快结束了。\n风扇还在转。\n你还在。\n一切都好。",
  ];

  var textEl = document.getElementById('typewriter-text');
  var cursorEl = document.getElementById('typewriter-cursor');
  var currentIdx = Math.floor(Math.random() * monologues.length);
  var charIdx = 0;
  var isTyping = false;
  var typingSpeed = 42;
  var pauseAfterDone = 6000;
  var eraseSpeed = 18;
  var pauseBeforeNext = 2000;

  function shuffleNext() {
    var next;
    do { next = Math.floor(Math.random() * monologues.length); }
    while (next === currentIdx && monologues.length > 1);
    currentIdx = next;
    charIdx = 0;
  }

  function typeChar() {
    if (!isTyping) return;
    var text = monologues[currentIdx];
    if (charIdx < text.length) {
      textEl.textContent = text.slice(0, charIdx + 1);
      charIdx++;
      var delay = typingSpeed;
      // Slightly longer pause on newlines and punctuation
      var ch = text[charIdx - 1];
      if (ch === '\n') delay = typingSpeed * 3;
      else if ('。，、；：！？…—'.indexOf(ch) >= 0) delay = typingSpeed * 2.5;
      setTimeout(typeChar, delay);
    } else {
      // Done typing
      cursorEl.classList.add('paused');
      setTimeout(startErase, pauseAfterDone);
    }
  }

  function startTyping() {
    isTyping = true;
    cursorEl.classList.remove('paused');
    textEl.textContent = '';
    charIdx = 0;
    typeChar();
  }

  function startErase() {
    isTyping = true;
    cursorEl.classList.remove('paused');
    eraseLoop();
  }

  function eraseLoop() {
    if (!isTyping) return;
    var text = monologues[currentIdx];
    if (charIdx > 0) {
      charIdx--;
      textEl.textContent = text.slice(0, charIdx);
      setTimeout(eraseLoop, eraseSpeed);
    } else {
      isTyping = false;
      cursorEl.classList.add('paused');
      shuffleNext();
      setTimeout(startTyping, pauseBeforeNext);
    }
  }

  // Start on load
  startTyping();
})();
</script>
